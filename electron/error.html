<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard Error</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      -webkit-app-region: drag;
    }
    .container {
      text-align: center;
      max-width: 520px;
      padding: 48px 40px;
      -webkit-app-region: no-drag;
    }
    .icon { font-size: 56px; margin-bottom: 20px; }
    h1 { color: #ff6b6b; font-size: 22px; margin-bottom: 12px; font-weight: 600; }
    p { color: #999; line-height: 1.6; margin-bottom: 20px; font-size: 14px; }
    .details {
      background: rgba(255,107,107,0.08);
      border: 1px solid rgba(255,107,107,0.25);
      border-radius: 8px;
      padding: 16px;
      margin: 20px 0;
      text-align: left;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 12px;
      color: #ccc;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 140px;
      overflow-y: auto;
    }
    .actions { display: flex; gap: 12px; justify-content: center; margin-top: 28px; }
    button {
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
    }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-primary:hover { background: #2563eb; }
    .btn-secondary { background: #1e1e1e; color: #ccc; border: 1px solid #333; }
    .btn-secondary:hover { background: #2a2a2a; }
    .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .retrying .spinner { display: inline-block; }
    .retrying .btn-text { display: none; }
    .retry-status { color: #999; font-size: 12px; margin-top: 12px; min-height: 18px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">⚠️</div>
    <h1>Dashboard Failed to Load</h1>
    <p>The server may not be running, or took too long to respond. Check that the dev server is started.</p>
    <div class="details" id="details">Loading error info...</div>
    <div class="actions">
      <button class="btn-primary" id="retryBtn" onclick="retryLoad()">
        <span class="spinner" id="spinner"></span>
        <span class="btn-text">Retry Connection</span>
      </button>
      <button class="btn-secondary" onclick="window.close()">Quit</button>
    </div>
    <div class="retry-status" id="status"></div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const error = decodeURIComponent(params.get('error') || 'Unknown error');
    const code = params.get('code') || '?';
    const port = params.get('port') || '5000';
    document.getElementById('details').textContent =
      `Error code: ${code}\n${error}\n\nExpected server at: http://127.0.0.1:${port}`;

    let retrying = false;
    async function retryLoad() {
      if (retrying) return;
      retrying = true;
      const btn = document.getElementById('retryBtn');
      const status = document.getElementById('status');
      btn.classList.add('retrying');
      status.textContent = 'Checking server...';

      for (let i = 0; i < 6; i++) {
        try {
          const resp = await fetch(`http://127.0.0.1:${port}/api/uploads`, { signal: AbortSignal.timeout(3000) });
          if (resp.ok || resp.status < 500) {
            status.textContent = 'Server found! Reloading...';
            setTimeout(() => {
              window.location.href = `http://127.0.0.1:${port}`;
            }, 300);
            return;
          }
        } catch {}
        status.textContent = `Attempt ${i + 2} of 6...`;
        await new Promise(r => setTimeout(r, 1500));
      }

      status.textContent = 'Server still unreachable. Start your dev server first.';
      btn.classList.remove('retrying');
      retrying = false;
    }
  </script>
</body>
</html>
