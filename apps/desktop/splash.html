<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #e0e0e0;
      user-select: none;
      -webkit-app-region: drag;
    }

    .container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 32px;
      gap: 24px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, hsl(210, 50%, 55%), hsl(210, 50%, 35%));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -1px;
    }

    .logo-text {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: #f0f0f0;
    }

    .progress-track {
      width: 200px;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 30%;
      background: hsl(210, 50%, 55%);
      border-radius: 2px;
      animation: slide 1.4s ease-in-out infinite;
    }

    @keyframes slide {
      0%   { transform: translateX(-100%); width: 30%; }
      50%  { transform: translateX(100%);  width: 60%; }
      100% { transform: translateX(350%);  width: 30%; }
    }

    .status {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 0.3px;
      min-height: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <div class="logo-icon">Q</div>
      <div class="logo-text">QuantAI Dashboard</div>
    </div>
    <div class="progress-track">
      <div class="progress-bar"></div>
    </div>
    <div class="status" id="status">Initializing...</div>
  </div>
  <script>
    window.addEventListener("message", (e) => {
      if (e.data && e.data.status) {
        document.getElementById("status").textContent = e.data.status;
      }
    });
  </script>
</body>
</html>
