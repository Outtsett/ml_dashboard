    "hvplot>=0.12.2",
    "numpy>=2.4.1",
    "orjson>=3.11.5",
    "pandas>=3.0.0",
    "pandas-ta>=0.3.14b1",
    "panel>=1.8.7",
    "polars>=1.37.1",
    "psycopg2-binary>=2.9.11",
    "pyarrow>=23.0.0",
]
