[project]
name = "ml-dashboard"
version = "0.1.0"
description = "ML Dashboard for quantitative trading research"
requires-python = ">=3.13"
dependencies = [
    # ── Scientific core ─────────────────────────────────────────────
    "numpy>=2.4,<3",
    "pandas>=2.3,<3",           # pandas 3.0 ecosystem support incomplete as of 2026-05
    "polars>=1.37",
    "pyarrow>=23",
    "scipy>=1.16,<2",
    "duckdb>=1.4",
    # ── ML / training ───────────────────────────────────────────────
    "torch==2.11.0",            # sm_120-aware build via [tool.uv.sources] -> pytorch-cu130 index
    "scikit-learn>=1.6,<2",
    "scikit-optimize>=0.10",    # imported as `skopt` in optimizers/bayesian_optimizer.py
    "xgboost>=3.1,<4",
    "lightgbm>=4.6,<5",
    "optuna>=4.8,<5",
    "nevergrad>=1.0",
    "numba>=0.64,<1",
    "hmmlearn>=0.3",
    "gymnasium>=1.0",
    "joblib>=1.4",
    "catboost>=1.2.10",         # Model Cycle: cycle/catboost_adapter.py
    "statsmodels>=0.15.0",      # Model Cycle: cycle/statsmodels_adapter.py (Probit)
    # ── Model Cycle bridge families (cycle/bridges/, cycle/adapters_extra/<family>/) ──
    # Pinned to the versions measured in .venv on 2026-09-29 (importlib.metadata). The
    # first 21 were installed but undeclared, so `uv sync` (exact) would have removed them.
    "stable-baselines3==2.9.0",   # policy / hierarchical / world-model agents: PPO, A2C, SAC, DDPG, TD3
    "sb3-contrib==2.9.0",         # TRPO, RecurrentPPO
    "torchdiffeq==0.2.5",         # neural ODE backbones and dynamics
    "gplearn==0.4.3",             # symbolic regression
    "kanren==0.3.0",              # SLD resolution (symbolic_reasoner)
    "python-constraint==1.4.0",   # soft constraint satisfaction
    "scikit-fuzzy==0.5.0",        # Mamdani / Takagi-Sugeno reference
    "pymc==6.3.2",                # Bayesian predictive (NUTS through nutpie)
    "prophet==1.4.0",             # series_forecast prophet variant
    "cmdstanpy==1.3.0",           # prophet's Stan backend
    "arviz==1.3.0",               # R-hat and posterior summaries
    "networkx==3.6.1",            # option graphs, subgoal discovery
    "bayesian-optimization==1.4.0",
    "simpy==4.1.2",               # event simulation
    "pgmpy==1.1.2",               # Bayesian and decision networks
    "lifelines==0.30.3",          # barrier survival models
    "arch==8.0.0",                # GARCH
    "cma==4.4.4",                 # CMA-ES
    "pyswarms==1.3.0",            # particle swarm
    "deap==1.4.4",                # genetic algorithms and genetic programming
    "mord==0.7",                  # ordinal regression reference
    # installed 2026-09-29 for the bridge families
    "minisom==2.3.6",             # self-organising maps (latent_state_readout)
    "umap-learn==0.5.12",         # UMAP (latent_projection_head); brings pynndescent
    "openTSNE==1.0.4",            # out-of-sample t-SNE (latent_projection_head)
    "cvxpy==1.9.3",               # signal_program; brings clarabel, osqp, scs
    "nutpie==0.16.11",            # compiled NUTS for PyMC (bayesian_predictive)
    # ── Validation / config ─────────────────────────────────────────
    "pydantic>=2.10,<3",
    "jinja2>=3.1",
    # ── Sentiment (FinBERT, mandatory in every model) ───────────────
    "transformers==5.16.1",     # lake.finbert.FinBert — ProsusAI/finbert on the GPU
    # ── Data sources / DB ───────────────────────────────────────────
    "databento>=0.70",
    "psycopg2-binary>=2.9.11",
    "aiohttp>=3.13",            # live/ hub: vendor sockets + its own HTTP/SSE server
    "feedparser>=6.0.11",       # live/ hub: RSS/Atom news feeds, timezone-aware pubDate
    "s3fs==2026.7.0",           # lake.layout's s3:// paths (raw landing, curated writes) — same set as datalake
    "aiobotocore==3.9.0",
    "boto3==1.43.56",
    "botocore==1.43.56",
    # ── MCP server (mcp_server/, stdio for Claude Code) ─────────────
    "fastmcp==3.1.1",
    "python-dotenv>=1.1",
    # ── System / GPU instrumentation ───────────────────────────────
    "psutil>=6",
    "nvidia-ml-py>=12",         # provides `pynvml` import; replaces deprecated pynvml package
    "universal-pathlib>=0.3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "ruff>=0.14,<1",
    "mypy>=1.19,<2",
]

# ── uv: pin PyTorch to the cu130 (sm_120 Blackwell) index ──────────
# Without this, uv resolves torch from PyPI (which only has +cpu / +cu129 wheels).
[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
target-version = "py313"
src = ["src/ml", "scripts"]
line-length = 100

[tool.ruff.lint]
select = [
    "F401",   # unused imports
    "F811",   # redefined unused name
    "F841",   # unused local variable
    "I",      # isort (import sorting/grouping)
]
fixable = ["F401", "I"]

[tool.ruff.lint.isort]
known-first-party = ["ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "src/ml"]
addopts = "--import-mode=importlib"
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
