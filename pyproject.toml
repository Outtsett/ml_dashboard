[project]
name = "ml-dashboard"
version = "0.1.0"
description = "ML Dashboard for quantitative trading research"
requires-python = ">=3.11"
dependencies = [
    "bokeh>=3.8.2",
    "databento>=0.70.0",
    "duckdb>=1.2.0",
    "holoviews>=1.22.1",
    "hvplot>=0.12.2",
    "numpy>=2.4.1",
    "orjson>=3.11.5",
    "pandas>=3.0.0",
    "pandas-ta>=0.3.14b1",
    "panel>=1.8.7",
    "polars>=1.37.1",
    "psycopg2-binary>=2.9.11",
    "pyarrow>=23.0.0",
    "numba==0.61.0",
    "optuna==4.3.0",
    "wandb>=0.25.0",
]

[tool.ruff]
target-version = "py311"
src = ["src/ml", "scripts"]
line-length = 100

[tool.ruff.lint]
select = [
    "F401",   # unused imports
    "F811",   # redefined unused name
    "F841",   # unused local variable
    "I",      # isort (import sorting/grouping)
]
fixable = ["F401", "I"]

[tool.ruff.lint.isort]
known-first-party = ["ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "src/ml"]
addopts = "--import-mode=importlib"
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
