name: OpenSSF Scorecard

# Continuously rates this repository's supply-chain posture against the
# OpenSSF Scorecard checks (branch protection, signed releases, pinned
# dependencies, dangerous workflows, ...).
#
# GATED. `publish_results: true` submits to the public OpenSSF Scorecard API,
# which only accepts PUBLIC repositories, and the SARIF upload needs code
# scanning (GHAS on a private repo). Both fail here, so the weekly run was
# permanently red.
#
# Re-enable by setting the repository variable ENABLE_CODE_SCANNING=true once
# this repo is public or GHAS is on.
#
# Results upload to:
#   - GitHub Code Scanning (Security tab)
#   - The public Scorecard API (publish_results: true) → grants a badge
#     at https://api.securityscorecards.dev/projects/github.com/<owner>/<repo>

on:
  branch_protection_rule:
  schedule:
    # Weekly Mondays 04:37 UTC — off-peak, before downstream weekly scans.
    - cron: '37 4 * * 1'
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    if: vars.ENABLE_CODE_SCANNING == 'true'
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          sarif_file: results.sarif
