name: OpenSSF Scorecard

# Continuously rates this repository's supply-chain posture against the
# OpenSSF Scorecard checks (branch protection, signed releases, pinned
# dependencies, dangerous workflows, ...).
#
# Results upload to:
#   - GitHub Code Scanning (Security tab)
#   - The public Scorecard API (publish_results: true) → grants a badge
#     at https://api.securityscorecards.dev/projects/github.com/<owner>/<repo>

on:
  branch_protection_rule:
  schedule:
    # Weekly Mondays 04:37 UTC — off-peak, before downstream weekly scans.
    - cron: '37 4 * * 1'
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Run analysis
        uses: ossf/scorecard-action@v2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
