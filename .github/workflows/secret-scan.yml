name: Secret Scan

# Gitleaks over the working tree (push/PR) and the full history (schedule).
#
# The SARIF upload was removed: this repository is private, GitHub code scanning
# needs Advanced Security there, and the upload failed on every run. Findings now
# go to the job summary and an artifact, and the job fails on any hit.
#
# False positives belong in `.gitleaksignore`, one fingerprint per line, each with
# a sentence explaining why it is not a secret.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly full-history scan on Mondays 06:23 UTC.
    - cron: '23 6 * * 1'
  workflow_dispatch:

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history for the scheduled sweep; a shallow tree is enough for
          # push/PR, where only the current state matters.
          fetch-depth: ${{ github.event_name == 'schedule' && 0 || 1 }}

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      # `detect` walks git history; `dir` walks the checked-out tree. Scheduled
      # runs do the history sweep, everything else scans the current state.
      - name: Scan
        id: scan
        run: |
          set +e
          if [ "${{ github.event_name }}" = "schedule" ]; then
            gitleaks detect --source . --redact --report-format json \
              --report-path gitleaks-report.json --exit-code 1 --verbose > gitleaks-log.txt 2>&1
          else
            gitleaks dir . --redact --report-format json \
              --report-path gitleaks-report.json --exit-code 1 --verbose > gitleaks-log.txt 2>&1
          fi
          echo "code=$?" >> "$GITHUB_OUTPUT"
          tail -n 100 gitleaks-log.txt

      - name: Publish findings to job summary
        if: always()
        run: |
          {
            echo "## Gitleaks"
            echo
            count=$(jq 'length' gitleaks-report.json 2>/dev/null || echo 0)
            if [ "${count:-0}" -gt 0 ]; then
              echo "**${count} finding(s).** Secrets are redacted in this report."
              echo
              echo "| Rule | File | Line | Commit |"
              echo "| --- | --- | --- | --- |"
              jq -r '.[:60][] | "| \(.RuleID // "") | \(.File // "") | \(.StartLine // "") | \((.Commit // "")[0:10]) |"' \
                gitleaks-report.json
              if [ "$count" -gt 60 ]; then
                echo
                echo "_... and $((count - 60)) more (see the artifact)._"
              fi
            else
              echo "No findings."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-report-${{ github.sha }}
          path: |
            gitleaks-report.json
            gitleaks-log.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Fail on findings
        if: steps.scan.outputs.code != '0'
        run: |
          echo "::error::gitleaks exited ${{ steps.scan.outputs.code }} — see the job summary. If a hit is a false positive, add its fingerprint to .gitleaksignore with a reason."
          exit 1
