name: Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── Stage 0: refuse to release a commit CI has not passed ──────────────────
  #
  # release.yml triggers on push to master with no relationship to ci.yml, so a
  # commit that failed every gate still cut a tag, built three installers and
  # published them. This job asks GitHub what the CI workflow concluded for THIS
  # exact SHA and fails if the answer is anything but success.
  #
  # It waits rather than reading once, because both workflows start from the same
  # push and CI takes minutes — checking immediately would always find it still
  # running.
  ci-gate:
    name: Require CI green
    runs-on: ubuntu-latest
    # 70 minutes. ci.yml's critical path is static(12) -> build(15) -> e2e(30),
    # so a 45-minute gate could time out and refuse a release while CI was still
    # legitimately running. The job spends that time asleep between polls.
    timeout-minutes: 70
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for the CI workflow on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 3900 ))   # 65 minutes, inside the job's 70

          while [ "$(date +%s)" -lt "$deadline" ]; do
            payload=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=1" \
              --jq '.workflow_runs[0] | {status: .status, conclusion: .conclusion, url: .html_url}' 2>/dev/null || echo '')

            if [ -z "$payload" ] || [ "$payload" = "null" ]; then
              echo "No CI run found for $SHA yet; waiting..."
              sleep 30
              continue
            fi

            status=$(echo "$payload" | jq -r .status)
            conclusion=$(echo "$payload" | jq -r .conclusion)
            url=$(echo "$payload" | jq -r .url)

            if [ "$status" != "completed" ]; then
              echo "CI is $status for $SHA ($url); waiting..."
              sleep 30
              continue
            fi

            if [ "$conclusion" = "success" ]; then
              echo "CI succeeded for $SHA ($url) — releasing."
              exit 0
            fi

            echo "::error::CI concluded '$conclusion' for $SHA ($url). Refusing to release."
            exit 1
          done

          echo "::error::Timed out waiting for CI to complete on $SHA. Refusing to release."
          exit 1

  # ── Stage 1: release-please drafts/promotes the release PR ─────────────────
  release-please:
    name: Release-please
    needs: [ci-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      upload_url: ${{ steps.rp.outputs.upload_url }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: rp
        with:
          release-type: node
          token: ${{ secrets.GITHUB_TOKEN }}

  # ── Stage 2: build Electron installers per OS, attach to GH release ────────
  build-electron:
    name: Build Electron (${{ matrix.os }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_glob: 'release/*.exe'
          - os: ubuntu-latest
            artifact_glob: 'release/*.AppImage'
          - os: macos-latest
            artifact_glob: 'release/*.dmg'
    env:
      HUSKY: '0'
      NPM_CONFIG_FUND: 'false'
      NPM_CONFIG_AUDIT: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install (clean)
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Build app + Electron installer
        run: npm run build:electron
        env:
          # electron-builder reads this for code-signing on macOS;
          # left undefined → unsigned dev build (acceptable for now).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Attach to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: ${{ matrix.artifact_glob }}
          # Fail loudly. With this false, an electron-builder run that produced
          # no installer attached nothing and the job still went green — the
          # release page would simply be missing a platform and nobody would know
          # until someone tried to download it.
          fail_on_unmatched_files: true

  # ── Stage 3: SBOM + provenance for every release ───────────────────────────
  sbom:
    name: Generate SBOM
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --legacy-peer-deps --no-audit --no-fund --ignore-scripts

      # Pinned, not @latest. Every `uses:` in this repository is SHA-pinned; this
      # line was the one place a release reached outside the lockfiles and
      # executed whatever the registry served at that moment — inside a job
      # holding `contents: write`. An SBOM exists to state exactly what shipped,
      # so generating it with an unpinned tool undercuts the artifact's whole
      # purpose.
      - name: Generate CycloneDX SBOM (npm)
        run: |
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1 \
            --output-file sbom-npm.cyclonedx.json \
            --output-format JSON

      - name: Attach SBOM to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: sbom-npm.cyclonedx.json
          # A release with no SBOM is a release that cannot state what it ships.
          fail_on_unmatched_files: true
