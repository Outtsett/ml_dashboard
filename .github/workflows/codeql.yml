name: CodeQL

# GATED. This repository is PRIVATE, and CodeQL analysis + its SARIF upload both
# require GitHub Advanced Security on private repos. Without it the job failed
# every week at checkout ("Repository not found") and at upload ("Code scanning
# is not enabled for this repository") — a standing red that taught everyone to
# ignore the Actions tab.
#
# To turn it back on, set the repository variable ENABLE_CODE_SCANNING=true
# (Settings -> Secrets and variables -> Actions -> Variables) once GHAS is
# enabled or the repo is public. The job then runs unchanged; nothing else here
# needs editing. Until then it reports as *skipped*, which is honestly
# distinguishable from *failed*.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly scan on Mondays 08:17 UTC. Off-peak slot avoids the top-of-hour
    # contention that GitHub recommends spreading scheduled jobs across.
    - cron: '17 8 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    if: vars.ENABLE_CODE_SCANNING == 'true'
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          category: '/language:${{ matrix.language }}'
