name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, synchronize]
  issues:
    types: [opened, assigned, labeled]

# Concurrency keyed by event scope so reviews + interactive runs don't fight
# each other on the same PR/issue. Cancel stale runs on rapid resyncs.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# The repository is public: only the owner's comments, reviews, issues, pull requests
# and labels start a job, since the jobs below hold write permissions.
jobs:
  claude-interactive:
    name: Claude (Interactive)
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && github.event.review.author_association == 'OWNER') ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude') && github.event.issue.author_association == 'OWNER')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@7b0b255830a1fab6e602658672acad11c12d841d # v1
        with:
          trigger_phrase: "@claude"

  claude-pr-review:
    name: Claude PR Review
    if: |
      github.event_name == 'pull_request' &&
      (github.event.action == 'opened' || github.event.action == 'synchronize') &&
      github.event.pull_request.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@7b0b255830a1fab6e602658672acad11c12d841d # v1
        with:
          prompt: |
            Review this pull request. Focus on:
            1. Code correctness and potential bugs
            2. Security implications
            3. Performance considerations
            4. Adherence to project conventions (check CLAUDE.md if present)

            Be concise. Only comment on issues that matter.

  claude-issue-impl:
    name: Claude Issue Implementation
    if: |
      github.event_name == 'issues' &&
      (github.event.action == 'labeled' && github.event.label.name == 'claude') &&
      github.event.sender.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@7b0b255830a1fab6e602658672acad11c12d841d # v1
        with:
          label_trigger: "claude"
