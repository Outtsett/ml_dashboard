name: Dependency Review

on:
  pull_request:
    branches: [main, master]

concurrency:
  group: depreview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Block PRs that introduce dependencies with these severities or
          # higher. "moderate" matches GitHub's recommended baseline for
          # production dependencies.
          fail-on-severity: moderate
          # Disallow GPL-family copyleft licenses to remain compatible with
          # this repository's Source-Available View-Only License (see LICENSE).
          deny-licenses: |
            AGPL-1.0-only,
            AGPL-1.0-or-later,
            AGPL-3.0-only,
            AGPL-3.0-or-later,
            GPL-2.0-only,
            GPL-2.0-or-later,
            GPL-3.0-only,
            GPL-3.0-or-later
          comment-summary-in-pr: on-failure
