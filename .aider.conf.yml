# Aider configuration for ML Dashboard
# Uses quantai-coder (custom Ollama model with baked-in trading domain persona)

# Model configuration
model: ollama_chat/quantai-coder
editor-model: ollama_chat/quantai-coder

# Git behavior — match Tyler's preferences
auto-commits: false
dirty-commits: false

# Don't lint/test automatically (Tyler runs manually)
auto-lint: false
auto-test: false

# Map the full repo for context
map-tokens: 4096
map-refresh: auto

# Output preferences
pretty: true
stream: true
dark-mode: true
